name: Build and Deploy Docker Image

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/basic-project:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/basic-project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            mkdir -p ~/basic-project

            cat > ~/basic-project/.env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DEBUG=False
            EOF

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/basic-project:latest

            docker stop basic-project 2>/dev/null || true
            docker rm basic-project 2>/dev/null || true

            docker run --rm --env-file ~/basic-project/.env ${{ secrets.DOCKERHUB_USERNAME }}/basic-project:latest uv run alembic upgrade head

            docker run -d --name basic-project --restart unless-stopped --env-file ~/basic-project/.env -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/basic-project:latest

            docker image prune -f
